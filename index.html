<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Mis Notas</h1>

        <form id="note-form">
            <input type="hidden" id="note-id">
            <input type="text" id="note-title" placeholder="Título" required>
            <textarea id="note-content" placeholder="Contenido" required></textarea>
            <div class="form-actions">
                <button type="submit" id="submit-btn">Agregar nota</button>
                <button type="button" id="cancel-btn" class="hidden">Cancelar</button>
            </div>
        </form>

        <div id="notes-list"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
